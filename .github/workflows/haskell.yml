  # The shared Obsidian style, from deps/style.hs. Its own job so a formatting
  # failure reports on its own rather than behind the cross builds, and it needs
  # neither haskell.nix nor import-from-derivation.
  style:
    runs-on: ubuntu-latest
    name: style (fourmolu + hlint)
    steps:
    - uses: actions/checkout@v4
      with:
        # release.nix imports deps/style.hs at evaluation time, so a
        # non-recursive clone cannot read the style checks at all.
        submodules: recursive
    - name: Install Nix
      uses: cachix/install-nix-action@v27
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
          extra-substituters = https://cache.nixos.org
          extra-trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
    - name: Check formatting and lint (release.nix -A lib.checks)
      run: nix-build release.nix -A lib.checks
