name: nix

on:
  pull_request:
  push:
    branches: [ next, master ]

env:
  # The nix every job installs. release.nix evaluates through
  # import-from-derivation. The S3 cache is a substituter with its own key
  # trusted, so a job reuses what an earlier job pushed.
  EXTRA_NIX_CONFIG: |
    experimental-features = nix-command flakes
    allow-import-from-derivation = true
    extra-substituters = https://cache.iog.io https://nixcache.reflex-frp.org ${{ vars.NIX_CACHE_URL }}
    extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= ryantrinkle.com-1:JJiAKaRv9mWgpVAz8dwewnZe0AzzEAzPkagE9SP5NWI= ${{ vars.NIX_CACHE_PUBLIC_KEY }}

jobs:
  # The `-A` path of every derivation in release.nix, for the smoke matrix.
  # Evaluating it computes every cabal plan, so it needs the submodules and
  # import-from-derivation like a build does. `--read-write-mode` lets the
  # evaluation build those plans: `--eval` alone opens the store read-only.
  nix-attrs:
    runs-on: ubuntu-latest
    outputs:
      paths: ${{ steps.eval.outputs.paths }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The repo pulls deps/nix-haskell and deps/reflex-dom in as
          # submodules, and nix-haskell carries its own pins.
          submodules: recursive
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: ${{ env.EXTRA_NIX_CONFIG }}
      - name: Evaluate release.nix -A attr-paths
        id: eval
        run: |
          paths=$(nix-instantiate --eval --strict --json --read-write-mode release.nix -A attr-paths)
          echo "paths=$paths" >> "$GITHUB_OUTPUT"

  # One build per derivation, each on its own runner, and on a push each
  # job signs and copies its own build closure to the cache. A broken cell
  # cancels no other build and holds back no other upload.
  nix-smoke:
    needs: nix-attrs
    runs-on: ubuntu-latest
    env:
      NIX_CACHE_URL: ${{ vars.NIX_CACHE_URL }}
    strategy:
      fail-fast: false
      matrix:
        attr: ${{ fromJSON(needs.nix-attrs.outputs.paths) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: ${{ env.EXTRA_NIX_CONFIG }}
      - name: Build release.nix -A ${{ matrix.attr }}
        run: |
          nix-build release.nix -A ${{ matrix.attr }} \
            --no-out-link \
            > "$RUNNER_TEMP/nix-build-outputs"
          mapfile -t outputs < "$RUNNER_TEMP/nix-build-outputs"
          nix-store --query --deriver "${outputs[@]}" > "$RUNNER_TEMP/nix-build-derivations"
          mapfile -t derivations < "$RUNNER_TEMP/nix-build-derivations"
          nix-store --query --requisites --include-outputs "${derivations[@]}" \
            | sort -u > "$RUNNER_TEMP/nix-build-paths"
      - name: Upload to S3 binary cache
        if: github.event_name == 'push'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          NIX_CACHE_PRIVATE_KEY: ${{ secrets.NIX_CACHE_PRIVATE_KEY }}
        run: |
          key_file="$RUNNER_TEMP/nix-cache-private-key"
          printf '%s\n' "$NIX_CACHE_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          mapfile -t paths < "$RUNNER_TEMP/nix-build-paths"
          nix store sign --recursive --key-file "$key_file" "${paths[@]}"
          nix copy --to "$NIX_CACHE_URL" "${paths[@]}"
