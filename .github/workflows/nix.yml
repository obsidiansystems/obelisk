name: nix

on:
  pull_request:
  push:
    branches: [ develop, master ]

env:
  # The nix every job installs. release.nix evaluates through
  # import-from-derivation. The S3 cache is a substituter with its own key
  # trusted, so a job reuses what an earlier job pushed.
  EXTRA_NIX_CONFIG: |
    experimental-features = nix-command flakes
    allow-import-from-derivation = true
    extra-substituters = https://cache.iog.io https://nixcache.reflex-frp.org
    extra-trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= ryantrinkle.com-1:JJiAKaRv9mWgpVAz8dwewnZe0AzzEAzPkagE9SP5NWI= ${{ vars.NIX_CACHE_PUBLIC_KEY }}

jobs:
  # The `-A` path of every cell of release.nix, for the smoke matrix. The
  # parts state their cells from their matrix lists, so this evaluation
  # builds nothing.
  nix-attrs:
    # A pull request whose head is `develop` or `master` in this repository
    # gets the push run for the same commit, so its own run is skipped. The
    # jobs below need this one, so the skip covers the whole run. The branch
    # list repeats the push trigger's: an expression cannot read it.
    if: >-
      github.event_name == 'push'
      || github.event.pull_request.head.repo.full_name != github.repository
      || !contains(fromJSON('["develop", "master"]'), github.head_ref)
    runs-on: ubuntu-latest
    outputs:
      paths: ${{ steps.eval.outputs.paths }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The repo pulls deps/nix-haskell and deps/reflex-dom in as
          # submodules, and nix-haskell carries its own pins.
          submodules: recursive
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: ${{ env.EXTRA_NIX_CONFIG }}
      - name: Evaluate release.nix -A attr-paths
        id: eval
        run: |
          paths=$(nix-instantiate --eval --strict --json --read-write-mode release.nix -A attr-paths)
          echo "paths=$paths" >> "$GITHUB_OUTPUT"

  # One build per cell, each on its own runner. On a push, and on a pull
  # request from a branch of this repository, each job signs and copies to
  # the cache every path its build made, also when the build fails or runs
  # out of time. A broken cell cancels no other build and holds back no
  # other upload.
  nix-smoke:
    needs: nix-attrs
    runs-on: ubuntu-latest
    env:
      NIX_CACHE_URL: ${{ vars.NIX_CACHE_URL }}
    strategy:
      fail-fast: false
      matrix:
        attr: ${{ fromJSON(needs.nix-attrs.outputs.paths) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: ${{ env.EXTRA_NIX_CONFIG }}
      - name: Instantiate release.nix -A ${{ matrix.attr }}
        id: instantiate
        run: |
          nix-instantiate release.nix -A ${{ matrix.attr }} \
            > "$RUNNER_TEMP/nix-build-derivations"
      - name: Build release.nix -A ${{ matrix.attr }}
        # Under the 360-minute job limit, so a build that runs out of time
        # fails here and the upload below still runs.
        timeout-minutes: 330
        run: |
          mapfile -t derivations < "$RUNNER_TEMP/nix-build-derivations"
          # Keep going past a failure, so the rest is built and uploaded.
          nix-build "${derivations[@]}" --keep-going --no-out-link
      - name: Collect the built paths
        id: collect
        if: ${{ !cancelled() && steps.instantiate.outcome == 'success' }}
        run: |
          mapfile -t derivations < "$RUNNER_TEMP/nix-build-derivations"
          # `--include-outputs` adds only the outputs that exist.
          nix-store --query --requisites --include-outputs "${derivations[@]}" \
            | sort -u > "$RUNNER_TEMP/nix-build-paths"
      - name: Upload to S3 binary cache
        # A fork's pull request runs code nobody trusted, so it does not upload.
        if: >-
          steps.collect.outcome == 'success'
          && !cancelled()
          && (github.event_name == 'push'
          || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          NIX_CACHE_PRIVATE_KEY: ${{ secrets.NIX_CACHE_PRIVATE_KEY }}
        run: |
          key_file="$RUNNER_TEMP/nix-cache-private-key"
          printf '%s\n' "$NIX_CACHE_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          mapfile -t paths < "$RUNNER_TEMP/nix-build-paths"
          nix store sign --recursive --key-file "$key_file" "${paths[@]}"
          nix copy --to "$NIX_CACHE_URL" "${paths[@]}"
